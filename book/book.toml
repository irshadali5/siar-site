[book]
authors = ["Irshad Ali <dev@siar.irshad.org.in>"]
language = "en"
multilingual = false
src = "."
title = "SIAR Comprehensive System Architecture & Protocol Specifications"
description = "Official architectural blueprints, cryptographic trust specifications, multi-transport orchestrations, and threat mitigation models for the SIAR ecosystem."

[output.html]
git-repository-url = "https://github.com/irshadali5/siar"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/irshadali5/siar/edit/main/sys-arch/{path}"
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/sys-arch/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true

[output.html.fold]
enable = true
level = 1
