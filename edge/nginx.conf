# SIAR Hardened Sovereign Edge Gateway Configuration
# Architecture: Part 07 - Global Edge CDN & Privacy Architecture
# Domain: siar.irshad.org.in | pkg.siar.irshad.org.in

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # Privacy & IP Anonymization: Zero out last octet of IPv4 and /48 of IPv6
    # =========================================================================
    map $remote_addr $remote_addr_anonymized {
        ~(?P<ip>\d+\.\d+\.\d+)\.\d+    $ip.0;
        ~(?P<ip>[^:]+:[^:]+:[^:]+):    $ip::;
        default                         0.0.0.0;
    }

    log_format privacy_combined '$remote_addr_anonymized - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "-"';

    access_log /var/log/nginx/access_privacy.log privacy_combined buffer=32k flush=5s;

    # Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip & Brotli Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # TLS 1.3 Strict Security
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen 80;
        listen [::]:80;
        server_name siar.irshad.org.in pkg.siar.irshad.org.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name siar.irshad.org.in pkg.siar.irshad.org.in;

        ssl_certificate /etc/letsencrypt/live/siar.irshad.org.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/siar.irshad.org.in/privkey.pem;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /var/www/siar-static;
        index index.html;

        # Debian APT Repository Cache
        location /deb/ {
            autoindex on;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # RPM Repository Cache
        location /rpm/ {
            autoindex on;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Static Release Artifacts
        location /releases/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Zero-Cookie Health Probe
        location /healthz {
            access_log off;
            return 200 '{"status":"HEALTHY","privacy":"ZERO_TRACKING"}\n';
            add_header Content-Type application/json;
        }
    }
}
