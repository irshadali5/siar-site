[plugin]
name = "iridium-sbd-satellite"
version = "1.0.4"
edition = "2024"
authors = ["Satellite Mesh Collective"]
description = "Iridium 9602/9603 Short Burst Data (SBD) satellite transceiver bridge"
license = "Apache-2.0"
homepage = "https://siar.irshad.org.in/plugins.html"
repository = "https://github.com/irshadali5/siar-iridium"
keywords = ["satellite", "iridium", "sbd", "global", "dtn"]
category = "transports"

[runtime]
engine = "wasm32-wasi"
entrypoint = "siar_iridium.wasm"
abi_version = 1
max_memory_mb = 32
cpu_time_limit_ms = 100

[capabilities]
hardware_uart = "/dev/ttyUSB0"
network_raw_sockets = false
local_storage_kv = true
