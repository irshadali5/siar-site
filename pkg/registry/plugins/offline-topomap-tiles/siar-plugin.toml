[plugin]
name = "offline-topomap-tiles"
version = "0.4.1"
edition = "2024"
authors = ["SIAR Geospatial Team"]
description = "High-resolution OpenStreetMap vector terrain tiles for off-grid search and rescue"
license = "ODbL-1.0"
homepage = "https://siar.irshad.org.in/plugins.html"
repository = "https://github.com/irshadali5/siar-maps"
keywords = ["maps", "geospatial", "terrain", "gis"]
category = "maps"

[runtime]
engine = "data-bundle"
entrypoint = "tiles.pmtiles"
abi_version = 1
max_memory_mb = 128
cpu_time_limit_ms = 10

[capabilities]
read_only_storage = true
network_raw_sockets = false
